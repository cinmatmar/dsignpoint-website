name: Deploy to dsignpoint.com (Infomaniak) — manual, needs approval

on:
  workflow_dispatch:
    inputs:
      clean_slate:
        description: "FIRST DEPLOY ONLY: delete everything currently in the server folder (old WordPress files) before uploading. Back up first."
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # In GitHub: Settings > Environments > production > add yourself as a required reviewer.
    # The deploy then waits for your approval before anything goes live.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to Infomaniak (FTP over TLS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: ${{ inputs.clean_slate }}
          exclude: |
            **/.git*
            **/.git*/**
            form-config.php
